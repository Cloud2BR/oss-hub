site_name: Cloud2BR OSS Hub
site_description: The open source hub for all Cloud2BR organizations and engagements.
site_url: https://cloud2br.github.io/oss-hub/
repo_url: https://github.com/Cloud2BR/oss-hub
repo_name: Cloud2BR/oss-hub
docs_dir: docs
site_dir: site
copyright: Copyright &copy; 2026 <a href="https://github.com/Cloud2BR" target="_blank" rel="noopener">Cloud2BR - Cloud to be Ready</a>
theme:
  name: material
  logo: https://avatars.githubusercontent.com/u/265654976?v=4
  favicon: https://avatars.githubusercontent.com/u/265654976?v=4
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    scheme: default
    primary: blue
    accent: blue
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
extra_css:
  - assets/css/custom.css
extra_javascript:
  - assets/js/logo-link.js
  - assets/js/external-links.js
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR
      name: Cloud2BR - Cloud to be Ready
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-TEC
      name: Cloud2BR TEC Hub
    - icon: fontawesome/brands/github
      link: https://github.com/Cloud2BR-MSFTLearningHub
      name: Cloud2BR Open Source Microsoft Cloud Sandbox - Learning Hub
nav:
  - Home: index.md
  - About: overview.md
